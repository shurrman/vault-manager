<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">vault-manager hierarchical values browser</title>
  <desc id="description">The three-pane terminal interface browsing a nested path inside the legacy secrets engine.</desc>
  <style>
    text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 18px;
      fill: #c9d1d9;
    }
    .app-title { font-size: 24px; font-weight: 700; fill: #79c0ff; }
    .section-title { font-size: 20px; font-weight: 700; fill: #79c0ff; }
    .selected { font-weight: 700; fill: #56d4dd; }
    .muted { fill: #8b949e; }
    .active { font-weight: 700; fill: #ffffff; }
    .directory { fill: #79c0ff; }
    .status { font-size: 16px; fill: #56d4dd; }
    .footer { font-size: 16px; fill: #8b949e; }
  </style>

  <rect width="1400" height="820" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="1398" height="818" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="28" y="48" class="app-title">vault-manager</text>
  <text x="260" y="48">Engines · hierarchical value browser</text>

  <rect x="24" y="76" width="248" height="662" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="290" y="76" width="370" height="662" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="678" y="76" width="698" height="662" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>

  <text x="44" y="112" class="section-title">Sections</text>
  <text x="44" y="153">  Status</text>
  <text x="44" y="187">  Groups</text>
  <text x="44" y="221">  Users</text>
  <text x="44" y="255">  Policies</text>
  <text x="44" y="289" class="selected">* Engines</text>
  <text x="44" y="323">  SSH</text>
  <text x="44" y="357">  Auth Methods</text>
  <text x="44" y="391">  Audit</text>
  <text x="44" y="425">  Tokens</text>

  <text x="310" y="112" class="section-title">Engines</text>
  <text x="310" y="153">  cubbyhole/  cubbyhole</text>
  <text x="310" y="187" class="selected">* legacy/     kv</text>
  <text x="310" y="221">  secret/     kv</text>
  <text x="310" y="255">  ssh/        ssh</text>
  <text x="310" y="289">  transit/    transit</text>

  <text x="698" y="112" class="section-title">legacy/platform/production</text>
  <text x="698" y="154" class="muted">Nested path is always visible in the panel title</text>

  <rect x="696" y="181" width="644" height="40" rx="4" fill="#1f6feb"/>
  <text x="710" y="208" class="active">&gt; database/</text>
  <text x="710" y="252" class="directory">  messaging/</text>
  <text x="710" y="296">  service-account</text>
  <text x="710" y="340">  settings</text>
  <text x="710" y="384" class="directory">  workloads/</text>

  <line x1="698" y1="430" x2="1340" y2="430" stroke="#30363d" stroke-width="2"/>
  <text x="698" y="468" class="muted">Enter on a directory descends one level</text>
  <text x="698" y="502" class="muted">Enter on a value opens its fields</text>
  <text x="698" y="536" class="muted">Esc or ← returns to legacy/platform</text>

  <text x="28" y="762" class="status">Values loaded</text>
  <text x="28" y="792" class="footer">↑↓ move  Enter open  Esc/← parent  r refresh  q close</text>
</svg>
