name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum

      - name: Validate the two-part release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vX.Y" >&2
            exit 1
          fi

      - name: Verify module files
        run: go mod tidy -diff

      - name: Test
        run: make test-race

      - name: Vet
        run: make vet

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build release archives
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "vault-manager ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/vault-manager_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" \
            "dist/vault-manager_${GITHUB_REF_NAME#v}_linux_arm64.tar.gz" \
            "dist/vault-manager_${GITHUB_REF_NAME#v}_darwin_amd64.tar.gz" \
            "dist/vault-manager_${GITHUB_REF_NAME#v}_darwin_arm64.tar.gz" \
            "dist/vault-manager_${GITHUB_REF_NAME#v}_windows_amd64.zip" \
            dist/checksums.txt \
            --clobber
